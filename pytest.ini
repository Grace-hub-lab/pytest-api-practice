[pytest]
# 把项目根目录加进 import 路径，用例里才能 from common.xxx import ...
pythonpath = .

# 只在 testcases 目录下找用例
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数：-v 显示每条用例，-s 显示 print，--tb=short 报错信息简短
addopts = -v --tb=short

# 让参数化用例的中文名正常显示（否则显示成 \u67e5 这种转义）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# 自定义标记（用 -m smoke 只跑冒烟用例）
markers =
    smoke: 冒烟用例，核心流程
    regression: 回归用例

# 控制台实时日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
