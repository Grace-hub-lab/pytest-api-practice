[pytest]
# 把项目根目录加进 import 路径，用例里才能 from common.xxx import ...
pythonpath = .

# 默认只跑 接口(testcases) 和 Web UI(ui)。
# Android 用例需要连真机，要单独跑：pytest android
testpaths = testcases ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数：-v 显示每条用例，--tb=short 报错信息简短（想看 print 输出就加 -s）
addopts = -v --tb=short

# 让参数化用例的中文名正常显示（否则显示成 \u67e5 这种转义）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# 自定义标记：pytest -m smoke / -m api / -m ui / -m "api and smoke"
# api / ui / android 三个标记会按目录自动加上（见根目录 conftest.py），不用手写
markers =
    smoke: 冒烟用例，核心流程
    regression: 回归用例
    api: 接口用例（testcases 目录）
    ui: Web UI 用例（ui 目录）
    android: Android / Fire TV 设备用例（android 目录）

# 控制台实时日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
